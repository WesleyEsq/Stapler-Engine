<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paper expressions — Stapler Engine Milestone 3</title>
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>
      <div id="hud">
        <div class="hud-card">
          <div class="hud-title">Stapler Engine — Milestone 3</div>
          <div class="hud-sub">WASD / Click to explore · Space/Click to interact · Esc for Pause / Save / Language</div>
          <div class="hud-controls">
            <button id="btn-pause" type="button">Pause (Esc)</button>
            <button id="btn-lighting" type="button">Lighting: Dynamic</button>
            <button id="btn-camera" type="button">Camera: Follow</button>
            <button id="btn-camlight" type="button">Cam Light: Off</button>
            <button id="btn-debug" type="button">Debug: Off</button>
          </div>
          <div id="hud-stats" class="hud-stats">Booting...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
